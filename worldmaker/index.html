<!doctype html><!--shell-->
<html lang="en"><!--shell-->
<head><!--shell-->
<meta charset="utf-8"><!--shell-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--shell-->
</head><!--shell-->
<body><!--shell-->
<title>Worldmaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: a full-bleed map canvas with floating cards: search top-left, tool rail left,
   tool options bottom-centre, details panel right (bottom sheet on phones). */
:root {
  --ui-bg: #ffffff; --ui-ink: #1c2430; --ui-muted: #5d6876; --ui-line: #dfe3e8; --ui-hover: #eef2f6;
  --accent: #1767d0; --accent-ink: #ffffff; --accent-soft: #e3eefc; --danger: #c62f2f;
  --shadow: 0 1px 2px rgba(20,30,50,.16), 0 4px 16px rgba(20,30,50,.12);
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  /* map palette */
  --m-land: #eef1ec; --m-water: #a9d3ec; --m-waterlabel: #3a6f99; --m-park: #c5e5bf; --m-forest: #a9d2a0;
  --m-greenlabel: #2f7a3b; --m-beach: #f4ecc8; --m-plaza: #e4e1dc; --m-building: #e0dcd5; --m-buildingedge: #cbc4ba;
  --m-road: #ffffff; --m-roadcase: #d0d5dc; --m-primary: #fff1b8; --m-primarycase: #dfc066;
  --m-highway: #f6bf4f; --m-highwaycase: #cf9028; --m-path: #a8957a; --m-rail: #9aa1aa;
  --m-label: #39414e; --m-halo: rgba(255,255,255,.92); --m-district: #6f7784;
  --m-route: #1767d0; --m-routecase: #0f4a9a; --m-sel: #1767d0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #1f242c; --ui-ink: #e6eaf0; --ui-muted: #9aa5b4; --ui-line: #343b46; --ui-hover: #2a313b;
    --accent: #5b9cf5; --accent-ink: #0d1520; --accent-soft: #22344d; --danger: #f07070;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --m-land: #1d232b; --m-water: #12304a; --m-waterlabel: #86b6dc; --m-park: #1f3a2a; --m-forest: #1a3324;
    --m-greenlabel: #82c592; --m-beach: #3a3626; --m-plaza: #2a3038; --m-building: #2c323b; --m-buildingedge: #3b434e;
    --m-road: #3d4552; --m-roadcase: #262c35; --m-primary: #5d5437; --m-primarycase: #3b3424;
    --m-highway: #8d6c2b; --m-highwaycase: #5c4519; --m-path: #74695a; --m-rail: #5b636e;
    --m-label: #d5dbe3; --m-halo: rgba(20,24,30,.9); --m-district: #9aa4b1;
    --m-route: #5b9cf5; --m-routecase: #2a5aa0; --m-sel: #5b9cf5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #1f242c; --ui-ink: #e6eaf0; --ui-muted: #9aa5b4; --ui-line: #343b46; --ui-hover: #2a313b;
  --accent: #5b9cf5; --accent-ink: #0d1520; --accent-soft: #22344d; --danger: #f07070;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  --m-land: #1d232b; --m-water: #12304a; --m-waterlabel: #86b6dc; --m-park: #1f3a2a; --m-forest: #1a3324;
  --m-greenlabel: #82c592; --m-beach: #3a3626; --m-plaza: #2a3038; --m-building: #2c323b; --m-buildingedge: #3b434e;
  --m-road: #3d4552; --m-roadcase: #262c35; --m-primary: #5d5437; --m-primarycase: #3b3424;
  --m-highway: #8d6c2b; --m-highwaycase: #5c4519; --m-path: #74695a; --m-rail: #5b636e;
  --m-label: #d5dbe3; --m-halo: rgba(20,24,30,.9); --m-district: #9aa4b1;
  --m-route: #5b9cf5; --m-routecase: #2a5aa0; --m-sel: #5b9cf5;
  color-scheme: dark;
}
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; background: var(--m-land); color: var(--ui-ink); font: 14px/1.4 var(--font-ui); overflow: hidden; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#map.drawing { cursor: crosshair; }
#map.grabbing { cursor: grabbing; }
.float { position: absolute; background: var(--ui-bg); box-shadow: var(--shadow); border-radius: 12px; z-index: 5; }

/* search */
#topbar { top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(392px, calc(100% - 32px)); display: flex; align-items: center; gap: 2px; padding: 4px; }
.iconbtn { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px; display: grid; place-items: center; color: var(--ui-muted); flex: none; }
.iconbtn:hover { background: var(--ui-hover); color: var(--ui-ink); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.go { color: var(--accent); }
.searchwrap { flex: 1; min-width: 0; position: relative; }
#search { width: 100%; height: 40px; border: 0; background: transparent; padding: 0 6px; outline: none; font-size: 15px; }
#search::placeholder { color: var(--ui-muted); }
#results { position: absolute; top: 46px; left: -48px; right: -46px; background: var(--ui-bg); border-radius: 0 0 12px 12px; box-shadow: var(--shadow); padding: 6px 0; max-height: 50vh; overflow: auto; }
#results button { display: flex; width: 100%; gap: 12px; align-items: center; padding: 8px 16px; border: 0; background: transparent; text-align: left; }
#results button:hover, #results button.on { background: var(--ui-hover); }
#results .rn { font-weight: 600; }
#results .rt { color: var(--ui-muted); font-size: 12px; }
#results .none { padding: 8px 16px; color: var(--ui-muted); }
.ricon { width: 22px; height: 22px; flex: none; border-radius: 50%; }

/* tool rail */
#tools { top: 72px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; padding: 4px; gap: 2px; }
.tool { width: 56px; padding: 7px 0 5px; border: 0; background: transparent; border-radius: 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ui-muted); font-size: 10.5px; font-weight: 500; letter-spacing: .01em; }
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--ui-hover); color: var(--ui-ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool:disabled { opacity: .35; cursor: default; background: transparent; }
.railsep { height: 1px; background: var(--ui-line); margin: 3px 6px; }

/* options bar */
#optbar { bottom: 20px; left: 50%; transform: translateX(-50%); max-width: min(760px, calc(100% - 32px)); padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--ui-line); background: var(--ui-bg); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--ui-hover); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip img, .chip .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.chip .sw { border-radius: 4px; border: 1px solid rgba(0,0,0,.12); }
.hint { color: var(--ui-muted); font-size: 13px; }
.btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ui-line); background: var(--ui-bg); font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--ui-hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--ui-bg); border-color: transparent; }

/* zoom + scale */
#zoom { right: max(16px, env(safe-area-inset-right, 0px)); bottom: 24px; display: flex; flex-direction: column; padding: 2px; }
#zoom button { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 9px; color: var(--ui-muted); display: grid; place-items: center; }
#zoom button:hover { background: var(--ui-hover); color: var(--ui-ink); }
#zoom svg { width: 20px; height: 20px; }
#scale { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 22px; z-index: 4; display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; color: var(--m-label); text-shadow: 0 0 3px var(--m-halo), 0 0 3px var(--m-halo); pointer-events: none; font-variant-numeric: tabular-nums; }
#scalebar { height: 6px; border: 2px solid var(--m-label); border-top: 0; }

/* panel */
#panel { top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: 340px; max-height: calc(100% - 132px); overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ph h2 { margin: 2px 0 0; font: 700 21px/1.2 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ui-muted); display: flex; align-items: center; gap: 6px; }
.eyebrow .dotc { width: 10px; height: 10px; border-radius: 50%; }
.x { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--ui-muted); font-size: 20px; line-height: 1; flex: none; }
.x:hover { background: var(--ui-hover); color: var(--ui-ink); }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--ui-muted); }
.fld input, .fld select, .fld textarea, .codebox { width: 100%; border: 1px solid var(--ui-line); background: var(--ui-bg); border-radius: 8px; padding: 8px 10px; }
.fld textarea, .codebox { resize: vertical; }
.codebox { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; height: 90px; }
.meta { margin: 0; color: var(--ui-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tip { margin: 0; font-size: 12.5px; color: var(--ui-muted); }
.sect { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--ui-line); }
.sect h3 { margin: 0; font-size: 13px; font-weight: 700; }
.titleinput { width: 100%; border: 1px solid transparent; border-radius: 8px; background: transparent; font: 700 22px/1.2 var(--font-display); padding: 2px 6px; margin-left: -6px; }
.titleinput:hover, .titleinput:focus { border-color: var(--ui-line); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ui-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ui-ink); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; color: var(--ui-muted); }
kbd { font: 600 11px/1 var(--font-ui); border: 1px solid var(--ui-line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ui-ink); white-space: nowrap; }

/* directions */
.seg { display: inline-flex; background: var(--ui-hover); border-radius: 9px; padding: 3px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--ui-muted); }
.seg button[aria-pressed="true"] { background: var(--ui-bg); color: var(--ui-ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.dirrows { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px 8px; align-items: center; }
.ab { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.ab.a { background: #2e9c4b; } .ab.b { background: #d9363e; }
.slot { text-align: left; height: 38px; padding: 0 10px; border: 1px solid var(--ui-line); background: var(--ui-bg); border-radius: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slot.empty { color: var(--ui-muted); }
.slot.picking { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.swap { grid-row: 1 / span 2; grid-column: 3; }
.summary { display: flex; align-items: baseline; gap: 10px; }
.summary .big { font: 700 24px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.summary .sm { color: var(--ui-muted); font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--ui-line); align-items: start; }
.steps li:first-child { border-top: 0; }
.steps .arr { color: var(--ui-muted); display: grid; place-items: center; height: 20px; }
.steps .arr svg { width: 18px; height: 18px; }
.steps .d { color: var(--ui-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.warn { margin: 0; color: var(--danger); font-size: 13px; }

#toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 9; background: var(--ui-ink); color: var(--ui-bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 680px) {
  #tools { top: auto; bottom: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .tool { flex: none; width: 54px; }
  .railsep { width: 1px; height: auto; margin: 6px 3px; flex: none; }
  #optbar { bottom: 90px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); transform: none; max-width: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  #zoom { bottom: auto; top: 72px; }
  #zoom button { width: 36px; height: 36px; }
  #scale { bottom: auto; top: 76px; left: max(16px, env(safe-area-inset-left, 0px)); }
  #panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 58%; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 7; }
  #results { left: -46px; right: -46px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <canvas id="map" aria-label="Map canvas"></canvas>

  <div id="topbar" class="float">
    <button id="btnMenu" class="iconbtn" aria-label="Map settings and saving" title="Map settings and saving"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search places and streets">
      <div id="results" hidden></div>
    </div>
    <button id="btnDir" class="iconbtn go" aria-label="Directions" title="Directions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M9 15v-3.5h6M12.5 9l2.5 2.5-2.5 2.5"/></svg></button>
  </div>

  <nav id="tools" class="float" aria-label="Map tools"></nav>
  <div id="optbar" class="float"></div>
  <aside id="panel" class="float" hidden></aside>

  <div id="zoom" class="float">
    <button id="zin" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="zfit" aria-label="Show whole map" title="Show whole map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="scale"><span id="scaletext">500 m</span><span id="scalebar"></span></div>
  <div id="toast" role="status" hidden></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#map'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const STORE = 'worldmaker.v1';
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------------------------------------------------------------- types */
const ROADS = {
  highway: { name: 'Highway',   w: 26, min: 3.4, fill: 'highway', cas: 'highwaycase', vis: 0,     wt: '700', size: 12, drive: 90, walk: 0 },
  primary: { name: 'Main road', w: 17, min: 2.4, fill: 'primary', cas: 'primarycase', vis: 0.02,  wt: '600', size: 12, drive: 50, walk: 5 },
  street:  { name: 'Street',    w: 11, min: 1.3, fill: 'road',    cas: 'roadcase',    vis: 0.06,  wt: '500', size: 11, drive: 30, walk: 5 },
  path:    { name: 'Footpath',  w: 3,  min: 1.3, fill: 'path',    cas: null,          vis: 0.15,  wt: '500', size: 10.5, drive: 0, walk: 5 },
  rail:    { name: 'Railway',   w: 4,  min: 2,   fill: 'rail',    cas: null,          vis: 0.015, wt: '500', size: 10.5, drive: 0, walk: 0 },
};
const RIVERS = { river: { name: 'River', w: 45 }, canal: { name: 'Canal', w: 24 }, stream: { name: 'Stream', w: 9 } };
const AREAS = {
  park: { name: 'Park', fill: 'park', lab: 'greenlabel' }, water: { name: 'Water', fill: 'water', lab: 'waterlabel' },
  forest: { name: 'Forest', fill: 'forest', lab: 'greenlabel' }, beach: { name: 'Beach', fill: 'beach', lab: 'label' },
  plaza: { name: 'Plaza', fill: 'plaza', lab: 'label' }, land: { name: 'Land / island', fill: 'land', lab: 'label' },
  building: { name: 'Building', fill: 'building', lab: 'label' },
};
const PLACES = {
  landmark: { name: 'Landmark', color: '#d4572a' }, food: { name: 'Food & drink', color: '#e0860a' },
  shop: { name: 'Shop', color: '#3f63d8' }, hotel: { name: 'Hotel', color: '#c0306f' },
  school: { name: 'School', color: '#6b5fb5' }, hospital: { name: 'Hospital', color: '#d9363e' },
  nature: { name: 'Nature', color: '#2e9c4b' }, transit: { name: 'Transit', color: '#1f7fbf' },
  home: { name: 'Home', color: '#5f6b7b' },
};
const LABELS = { district: { name: 'District' }, city: { name: 'City or town' } };
const KINDS = { road: ROADS, river: RIVERS, area: AREAS, poi: PLACES, label: LABELS };
const KIND_NAME = { road: 'Road', river: 'Waterway', area: 'Area', poi: 'Place', label: 'Map label' };

const PKEYS = ['land','water','waterlabel','park','forest','greenlabel','beach','plaza','building','buildingedge','road','roadcase','primary','primarycase','highway','highwaycase','path','rail','label','halo','district','route','routecase','sel'];
const P = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of PKEYS) P[k] = cs.getPropertyValue('--m-' + k).trim();
  P.uiBg = cs.getPropertyValue('--ui-bg').trim();
}

/* ---------------------------------------------------------------- state */
let world = { name: '', features: [] };
const view = { x: 0, y: 0, s: 0.2 };
let tool = 'select';
const subs = { road: 'street', river: 'river', area: 'park', place: 'landmark', label: 'district' };
let draft = null;          // {kind, sub, pts}
let rectDraft = null;      // {a:[x,y], b:[x,y]}
let selId = null, selVert = -1;
let cursorS = null;        // screen cursor
let snapHint = null;       // world point that the cursor snaps to
let route = null;
const dir = { from: null, to: null, mode: 'drive', pick: null };
let panelMode = null;
let gver = 0, graphCache = null;
let bbc = new WeakMap();

const uid = () => Math.random().toString(36).slice(2, 10);
const byId = id => world.features.find(f => f.id === id) || null;
const sel = () => (selId ? byId(selId) : null);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------------------------------------------------------- undo + save */
const undoS = [], redoS = [];
let lastSnap = '';
function snapNow() { return JSON.stringify(world); }
function invalidate() { bbc = new WeakMap(); gver++; }
function commit() {
  undoS.push(lastSnap); if (undoS.length > 150) undoS.shift();
  redoS.length = 0; lastSnap = snapNow(); invalidate(); save(); refreshRail();
  if (route && dir.from && dir.to) computeRoute();
}
function restore(json) {

/* ---------------------------------------------------------------- boot */
function boot() {
  readPalette(); makePlaceIcons();
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { stored = null; }
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  if (stored && stored.world && Array.isArray(stored.world.features)) {
    world = stored.world;
    if (stored.view && isFinite(stored.view.s)) Object.assign(view, stored.view);
  } else {
    world = exampleWorld();
    const s = Math.min(W / 4600, H / 3300);
    Object.assign(view, { x: W > 680 ? 950 : 1100, y: 250, s: clampScale(s) });
    setTimeout(() => toast('This is Port Ellery, an example world. Change anything, or open the menu to start a blank map.'), 400);
  }
  lastSnap = snapNow(); invalidate(); save();
  refreshRail(); renderOptbar(); updateTitle(); resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
}
boot();
})();
