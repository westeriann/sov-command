# Builds the Sovereign Command desktop app for Windows, macOS and Linux.
# Run it from the Actions tab (Run workflow), push a tag like v0.1.0, or push
# a commit whose message contains [desktop].
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
  push:
    tags: ['v*']
    branches: ['**']

jobs:
  game:
    name: Generate the planet and build the game
    # branch pushes only build when asked to; tags and manual runs always build
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[desktop]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm run setup
      # the planet is the same every time for the same generator: keep it between
      # builds and only generate it again when tools/worldgen or its photos change
      - uses: actions/cache@v4
        id: world
        with:
          path: client/public/world
          key: world-${{ hashFiles('tools/worldgen/**', 'assets/samples/**') }}
      - if: steps.world.outputs.cache-hit != 'true'
        run: npm run world
      - run: npm run build:offline
      # the multiplayer website and the bundled server, for "Host a game"
      - run: npm run build
      - run: node tools/bundle-host.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: client/dist-offline
          retention-days: 3
      # the host bundle holds tens of thousands of small map tiles, which the artifact
      # download cannot unpack on Windows: send it as one archive instead
      - run: tar -cf host.tar -C desktop host
      - uses: actions/upload-artifact@v4
        with:
          name: host
          path: host.tar
          retention-days: 3

  desktop:
    name: Package (${{ matrix.os }})
    needs: game
    strategy:
      fail-fast: false
      matrix:
        # a manual run can build just one platform's installer
        os: ${{ fromJSON(github.event.inputs.platforms == 'windows' && '["windows-latest"]' || github.event.inputs.platforms == 'macos' && '["macos-latest"]' || github.event.inputs.platforms == 'linux' && '["ubuntu-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: game, path: client/dist-offline }
      - uses: actions/download-artifact@v4
        with: { name: host, path: . }
      - run: tar -xf host.tar -C desktop && rm host.tar
        shell: bash
      - run: npm ci || npm install
        working-directory: desktop
      - run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: SovereignCommand-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
          if-no-files-found: error
